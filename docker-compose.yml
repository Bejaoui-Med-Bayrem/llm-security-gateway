services:

  postgres:
    image: postgres:17
    container_name: llm-security-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_security}
      POSTGRES_USER: ${POSTGRES_USER:-llm_security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}

    ports:
      # Loopback only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: